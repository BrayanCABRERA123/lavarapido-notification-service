spring:
  application:
    name: notification-service
  # En local arranca con dev, salvo que se diga otra cosa con SPRING_PROFILES_ACTIVE.
  profiles:
    default: dev
  # Los secretos van en lavarapido-infra/.env, que no se sube al repositorio. Si este servicio
  # tiene su propio .env, ese gana. Las variables de entorno mandan sobre los dos.
  config:
    import:
      - optional:file:../lavarapido-infra/.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LavaRapido;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # las tablas las crea Liquibase, Hibernate solo revisa que el mapeo cuadre
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        use_nationalized_character_data: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Cada servicio tiene su propia tabla de changelog, porque los seis migran la misma base.
    database-change-log-table: DATABASECHANGELOG_NOTIFICATION
    database-change-log-lock-table: DATABASECHANGELOGLOCK_NOTIFICATION

  # RabbitMQ (ADR-004): solo se conecta si MESSAGING_ENABLED=true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # un mensaje que falla se reintenta 3 veces con espera creciente y luego va a la DLQ
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  # SMTP (mismas variables MAIL_* del security-service). Solo se usa si MAIL_ENABLED=true.
  # Gmail: smtp.gmail.com:587 + contraseña de aplicación. Mailpit (dev): localhost:1025.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:3006}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    # El mismo secreto, emisor y audiencia que usa security-service. Este servicio solo revisa
    # el token, no lo emite.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:lavarapido-security-service}
    audience: ${JWT_AUDIENCE:lavarapido-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    # false: el correo solo se anota en el log. true: se envía (hoy solo la bienvenida)
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:LavaRápido <no-reply@lavarapido.local>}
  messaging:
    # false: el servicio funciona sin RabbitMQ (solo bandeja + mensajes del admin)
    enabled: ${MESSAGING_ENABLED:false}
  push:
    # false: las push solo se escriben en el log. true: se envían con el servicio de Expo
    enabled: ${PUSH_ENABLED:false}
    expo-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    # opcional: solo si en expo.dev se activa "Enhanced security for push"
    access-token: ${EXPO_ACCESS_TOKEN:}
    timeout: 10s
  security-service:
    # de aquí se pide el correo del usuario para los avisos de reserva y recordatorios
    base-url: ${SECURITY_SERVICE_URL:http://localhost:3001}
    timeout: 3s
  internal:
    # llave compartida con security-service para /internal/** (X-Internal-Key).
    # Vacía: los avisos de reserva y recordatorios no van por correo (sí a la bandeja y push)
    api-key: ${INTERNAL_API_KEY:}
  reminders:
    # recordatorios de reserva (bandeja, push y correo). false: se programan pero no se envían
    enabled: ${REMINDERS_ENABLED:true}
    # con cuánta anticipación se avisa, antes de la hora de la reserva
    leads: ${REMINDER_LEADS:24h,1h}
    # cada cuánto se revisan los recordatorios vencidos
    check-interval: ${REMINDER_CHECK_INTERVAL:5m}
    initial-delay: 30s
    batch-size: 100

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # sin RabbitMQ encendido el servicio sigue sano; con mensajería activa sí se revisa
    rabbit:
      enabled: ${MESSAGING_ENABLED:false}
    # un SMTP caído no debe marcar el servicio como caído: el correo es secundario
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  service: notification-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
