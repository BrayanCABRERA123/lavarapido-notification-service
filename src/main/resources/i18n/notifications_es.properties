# Textos de las notificaciones (bandeja, push y correo) en espanol, el idioma por defecto.
# {nombre} es un dato del aviso. Los fragmentos que empiezan con espacio llevan "\ " al inicio.

format.when=dd/MM/yyyy 'a las' HH:mm
format.whenUnknown=horario reservado

welcome.title=¡Bienvenido a LavaRápido!
welcome.titleName=¡Bienvenido a LavaRápido, {name}!
welcome.message={start}{createdByAdmin}
welcome.admin=Tu cuenta de administrador quedó creada. Desde el panel gestionas reservas, operarios, pagos y la configuración del lavadero.
welcome.operator=Ya haces parte del equipo de LavaRápido como operario. En la app verás los servicios que te asignen y podrás iniciarlos y finalizarlos.
welcome.client=Tu cuenta quedó creada. Ya puedes registrar tus vehículos y reservar tu primer lavado.
welcome.createdByAdmin=\ Un administrador creó tu cuenta con este correo: para entrar, pídele tu contraseña o usa "¿Olvidaste tu contraseña?" en el inicio de sesión para crear una nueva.

booking.created.title=Reserva registrada
booking.created.message=Recibimos tu reserva{code} para el {when}. Te avisaremos cuando quede confirmada.
booking.confirmed.title=Reserva confirmada
booking.confirmed.message=Tu reserva{code} quedó confirmada para el {when}. Te esperamos en la sede.
booking.cancelled.title=Reserva cancelada
booking.cancelled.message=Tu reserva{code} fue cancelada.{reason}
booking.noShow.title=Reserva marcada como no asistida
booking.noShow.message=Tu reserva{code} quedó como "No asistió" porque no llegaste a la hora. Si fue un error, comunícate con el lavadero.
operator.scheduled.title=Nuevo servicio asignado
operator.scheduled.message=Tienes un servicio{code} programado para el {when}.
operator.assigned.title=Nuevo servicio asignado
operator.assigned.message=Te asignaron el servicio{code} para el {when}.
client.operatorAssigned.title=Operario asignado
client.operatorAssigned.message=Ya hay un operario asignado a tu reserva{code}.
service.started.title=Tu lavado comenzó
service.started.message=El operario empezó a lavar tu vehículo{code}.
service.completed.title=¡Tu vehículo está listo!
service.completed.message=Terminamos el servicio{code}. Ya puedes recogerlo y calificar la atención.
reminder.title=Recordatorio de tu lavado
reminder.message=Tu reserva{code} es el {when}. Te esperamos en la sede.

payment.confirmed.title=Pago aprobado
payment.confirmed.message=Aprobamos tu pago{amount}. ¡Gracias!
payment.rejected.title=Pago rechazado
payment.rejected.message=No pudimos aprobar tu pago{amount}.{reason} Puedes intentarlo de nuevo.
payment.refunded.title=Pago reembolsado
payment.refunded.message=Reembolsamos tu pago{amount}. Si tienes dudas, comunícate con el lavadero.

promotion.redeemed.title=Cupón canjeado: {name}
promotion.redeemed.message=Canjeaste el cupón {name} en tu reserva{code}{discount}.
promotion.defaultName=tu promoción
promotion.available.title=¡Tienes un cupón canjeable!
promotion.available.message=Con tus puntos desbloqueaste {promotion}{percent}. Usa el código {code} al pagar tu próxima reserva.
promotion.named=«{name}»
promotion.unnamed=una promoción
loyalty.earned.title=Ganaste {points}
loyalty.earned.message=Tu reserva{code} te dio {points} de fidelización.{balance}
points.one=1 punto
points.many={n} puntos

inspection.title=Reporte de inspección de tu vehículo
inspection.message=Este es el reporte de inspección de tu vehículo{plate}{code}.{phases}{findings}{link}

admin.created.title=Nueva reserva
admin.created.message=Se agendó la reserva{code} para el {when}.
admin.rescheduled.title=Reserva reprogramada
admin.rescheduled.message=La reserva{code} pasó del {from} al {to}.
admin.cancelled.title=Reserva cancelada
admin.cancelled.message=Se canceló la reserva{code} del {when}.{reason} El espacio quedó libre.
admin.unassigned.title=Reserva sin operario
admin.unassigned.upcoming=La reserva {code} es el {when} y todavía no tiene operario asignado. Asígnalo desde Reservas.
admin.unassigned.started=La reserva {code} ya debía empezar: era el {when} y todavía no tiene operario asignado. Asígnalo desde Reservas.
operator.rescheduled.title=Servicio reprogramado
operator.rescheduled.message=Tu servicio{code} ahora es el {when}.
operator.cancelled.title=Servicio cancelado
operator.cancelled.message=Se canceló el servicio{code} del {when}. Ya no tienes que atenderlo.
operator.unassigned.title=Servicio reasignado
operator.unassigned.message=El servicio{code} del {when} se asignó a otro operario. Ya no tienes que atenderlo.

fragment.reason=\ Motivo: {reason}.
fragment.amount=\ de {amount}
fragment.discount=: te descontamos {amount}
fragment.balance=\ Ahora tienes {points}.
fragment.percent=: {percent}% de descuento
fragment.inspectionCode=\ (reserva {code})
fragment.phases=\ Fases terminadas: {done} de {total}.
fragment.noFindings=\ No encontramos novedades.
fragment.findings=\ Hallazgos: {count}{major}{areas}
fragment.major=\ (importantes: {major})
fragment.areas=: {areas}{more}.
fragment.noAreas=.
fragment.moreAreas=\ y {n} más
fragment.link=\ Míralo con las fotos aquí: {url}

email.subject={title} — LavaRápido
email.greeting=Hola,
email.greetingName=Hola, {name}:
email.footer=LavaRápido · Este correo se envió automáticamente, no es necesario responderlo.

# versión nueva de la app (APP_UPDATE_AVAILABLE)
appUpdate.title=¡Hay una versión nueva de la app!
appUpdate.message=Ya está disponible la versión {version} de LavaRapidoVehicular. Toca este aviso para descargarla e instálala encima de la que tienes.

# el servicio terminó y nadie lo registró (OPERATOR/ADMIN_SERVICE_NOT_REGISTERED)
operator.notStarted.title=¿Atendiste este servicio?
operator.notStarted.message=El servicio{code} del {when} ya terminó y no se registró. Si lo atendiste, dale Iniciar y Finalizar ahora o avísale al administrador.
operator.notFinished.title=Servicio sin finalizar
operator.notFinished.message=El servicio{code} del {when} sigue en proceso. Si ya terminaste, dale Finalizar.
admin.notStarted.title=Servicio sin registrar
admin.notStarted.message=La reserva{code} del {when} terminó y nadie le dio Iniciar. Ciérrala desde el inicio: Se atendió o No asistió.
admin.notFinished.title=Servicio sin finalizar
admin.notFinished.message=La reserva{code} del {when} se inició y nadie la finalizó. Ciérrala desde el inicio con Se atendió.
# E-12: al reprogramar, el operario ya no puede atenderla y nadie más está libre
operator.released.title=Servicio retirado
operator.released.message=El servicio{code} se reprogramó para el {when} y a esa hora ya no puedes atenderlo. Ya no está a tu cargo.
admin.released.title=Reserva sin operario
admin.released.message=La reserva{code} se reprogramó para el {when}: su operario ya no puede atenderla y no hay otro libre. Asígnala desde Reservas.
