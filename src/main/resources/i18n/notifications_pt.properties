operator.notFinished.message=O serviço{code} de {when} ainda está em andamento. Se já terminou, toque em Finalizar.
admin.notStarted.title=Serviço não registrado
admin.notStarted.message=A reserva{code} de {when} terminou e ninguém tocou em Iniciar. Feche-a no início: Atendido ou Não compareceu.
admin.notFinished.title=Serviço não finalizado
admin.notFinished.message=A reserva{code} de {when} foi iniciada e ninguém a finalizou. Feche-a no início com Atendido.
