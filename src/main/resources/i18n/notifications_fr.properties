service.completed.title=Votre véhicule est prêt !
service.completed.message=Nous avons terminé le service{code}. Vous pouvez le récupérer et évaluer le service.
reminder.title=Rappel de votre lavage
reminder.message=Votre réservation{code} est le {when}. Nous vous attendons à la station.

payment.confirmed.title=Paiement approuvé
payment.confirmed.message=Nous avons approuvé votre paiement{amount}. Merci !
