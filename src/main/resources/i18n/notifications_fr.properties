# Textes des notifications (boite de reception, push et e-mail) en francais.

format.when=dd/MM/yyyy 'à' HH:mm
format.whenUnknown=l'horaire réservé

welcome.title=Bienvenue chez LavaRápido !
welcome.titleName=Bienvenue chez LavaRápido, {name} !
welcome.message={start}{createdByAdmin}
welcome.admin=Votre compte administrateur est prêt. Depuis le panneau, vous gérez les réservations, les opérateurs, les paiements et la configuration de la station.
welcome.operator=Vous faites désormais partie de l'équipe LavaRápido en tant qu'opérateur. Dans l'application, vous verrez les services qui vous sont attribués et pourrez les démarrer et les terminer.
welcome.client=Votre compte est prêt. Vous pouvez enregistrer vos véhicules et réserver votre premier lavage.
welcome.createdByAdmin=\ Un administrateur a créé votre compte avec cet e-mail : pour vous connecter, demandez-lui votre mot de passe ou utilisez « Mot de passe oublié ? » sur l'écran de connexion pour en créer un nouveau.

booking.created.title=Réservation enregistrée
