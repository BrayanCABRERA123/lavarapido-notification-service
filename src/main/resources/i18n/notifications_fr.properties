# versión nueva de la app (APP_UPDATE_AVAILABLE)
appUpdate.title=Une nouvelle version de l'application est disponible !
appUpdate.message=La version {version} de LavaRapidoVehicular est disponible. Touchez cet avis pour la télécharger et l'installer par-dessus celle que vous avez.

# le service est terminé et personne ne l'a enregistré (OPERATOR/ADMIN_SERVICE_NOT_REGISTERED)
operator.notStarted.title=Avez-vous effectué ce service ?
operator.notStarted.message=Le service{code} du {when} est terminé et n'a pas été enregistré. Si vous l'avez effectué, appuyez sur Démarrer puis Terminer maintenant, ou prévenez l'administrateur.
operator.notFinished.title=Service non terminé
operator.notFinished.message=Le service{code} du {when} est toujours en cours. Si vous avez fini, appuyez sur Terminer.
admin.notStarted.title=Service non enregistré
admin.notStarted.message=La réservation{code} du {when} est terminée et personne n'a appuyé sur Démarrer. Clôturez-la depuis l'accueil : Effectué ou Absent.
admin.notFinished.title=Service non terminé
admin.notFinished.message=La réservation{code} du {when} a démarré et personne ne l'a terminée. Clôturez-la depuis l'accueil avec Effectué.
# E-12: al reprogramar, el operario ya no puede atenderla y nadie más está libre
operator.released.title=Service retiré
operator.released.message=Le service{code} a été reprogrammé le {when} et vous ne pouvez plus vous en occuper à cette heure. Il n'est plus à votre charge.
admin.released.title=Réservation sans opérateur
admin.released.message=La réservation{code} a été reprogrammée le {when} : son opérateur ne peut plus s'en occuper et personne d'autre n'est libre. Attribuez-le depuis Réservations.
