operator.cancelled.message=Le service{code} du {when} a été annulé. Vous n'avez plus à vous en occuper.
operator.unassigned.title=Service réattribué
operator.unassigned.message=Le service{code} du {when} a été attribué à un autre opérateur. Vous n'avez plus à vous en occuper.

