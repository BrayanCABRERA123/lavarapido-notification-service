# Notification texts (inbox, push and email) in English.

format.when=MM/dd/yyyy 'at' h:mm a
format.whenUnknown=the booked time

welcome.title=Welcome to LavaRápido!
welcome.titleName=Welcome to LavaRápido, {name}!
welcome.message={start}{createdByAdmin}
welcome.admin=Your administrator account is ready. From the panel you manage bookings, operators, payments and the shop settings.
welcome.operator=You are now part of the LavaRápido team as an operator. In the app you will see the services assigned to you and you can start and finish them.
welcome.client=Your account is ready. You can now add your vehicles and book your first wash.
welcome.createdByAdmin=\ An administrator created your account with this email: to log in, ask them for your password or use "Forgot your password?" on the login screen to create a new one.

booking.created.title=Booking received
booking.created.message=We received your booking{code} for {when}. We will let you know when it is confirmed.
booking.confirmed.title=Booking confirmed
booking.confirmed.message=Your booking{code} is confirmed for {when}. See you at the shop.
booking.cancelled.title=Booking cancelled
booking.cancelled.message=Your booking{code} was cancelled.{reason}
operator.scheduled.title=New service assigned
operator.scheduled.message=You have a service{code} scheduled for {when}.
operator.assigned.title=New service assigned
operator.assigned.message=You were assigned the service{code} for {when}.
client.operatorAssigned.title=Operator assigned
client.operatorAssigned.message=An operator is now assigned to your booking{code}.
service.started.title=Your wash has started
service.started.message=The operator started washing your vehicle{code}.
service.completed.title=Your vehicle is ready!
service.completed.message=We finished the service{code}. You can pick it up and rate the service.
reminder.title=Your wash reminder
reminder.message=Your booking{code} is on {when}. See you at the shop.

payment.confirmed.title=Payment approved
payment.confirmed.message=We approved your payment{amount}. Thank you!
payment.rejected.title=Payment rejected
payment.rejected.message=We could not approve your payment{amount}.{reason} You can try again.
payment.refunded.title=Payment refunded
payment.refunded.message=We refunded your payment{amount}. If you have questions, contact the shop.

promotion.redeemed.title=Coupon redeemed: {name}
promotion.redeemed.message=You redeemed the coupon {name} on your booking{code}{discount}.
promotion.defaultName=your promotion
promotion.available.title=You have a coupon to redeem!
promotion.available.message=Your points unlocked {promotion}{percent}. Use the code {code} when paying for your next booking.
promotion.named="{name}"
promotion.unnamed=a promotion
loyalty.earned.title=You earned {points}
loyalty.earned.message=Your booking{code} gave you {points} of loyalty.{balance}
points.one=1 point
points.many={n} points

inspection.title=Your vehicle inspection report
inspection.message=This is the inspection report of your vehicle{plate}{code}.{phases}{findings}{link}

admin.created.title=New booking
admin.created.message=The booking{code} was scheduled for {when}.
admin.rescheduled.title=Booking rescheduled
admin.rescheduled.message=The booking{code} moved from {from} to {to}.
admin.cancelled.title=Booking cancelled
admin.cancelled.message=The booking{code} for {when} was cancelled.{reason} The slot is free again.
admin.unassigned.title=Booking without operator
admin.unassigned.upcoming=The booking {code} is on {when} and still has no operator assigned. Assign one from Bookings.
admin.unassigned.started=The booking {code} should have started already: it was on {when} and still has no operator assigned. Assign one from Bookings.
operator.rescheduled.title=Service rescheduled
operator.rescheduled.message=Your service{code} is now on {when}.
operator.cancelled.title=Service cancelled
operator.cancelled.message=The service{code} for {when} was cancelled. You no longer need to attend it.
operator.unassigned.title=Service reassigned
operator.unassigned.message=The service{code} for {when} was assigned to another operator. You no longer need to attend it.

fragment.reason=\ Reason: {reason}.
fragment.amount=\ of {amount}
fragment.discount=: we took {amount} off
fragment.balance=\ You now have {points}.
fragment.percent=: {percent}% off
